versioning:
  scheme: uri-path
  current: v1
  base: https://agent-ready.dev/api/v1
  spec_version: 1.0.0
  policy: >-
    Stable endpoints live under /api/v1; breaking changes ship behind a new version prefix (/api/v2, …) and
    never on the existing one. Unversioned public conveniences also exist outside the prefix: POST /api/scan
    (anonymous free tier), /ask (NLWeb alias of /api/v1/ask) and /api/x402/scan (paid lane).
  docs: https://agent-ready.dev/docs/api#versioning-and-deprecation-policy
deprecation:
  policy_documented: true
  policy_url: https://agent-ready.dev/docs/api#versioning-and-deprecation-policy
  sunset_header: true
  deprecation_header: true
  notice_period: at least 90 days before removal
  mechanism: >-
    When an endpoint is scheduled for removal the provider sets Sunset (RFC 8594) and Deprecation (RFC 9745)
    response headers with the planned removal date, marks the operation deprecated: true in the OpenAPI, and
    announces it in the changelog. The same policy text is embedded in the OpenAPI info.description, so it
    travels with the contract.
  deprecated_operations: []
  notes: >-
    "No /api/v1 endpoint is currently deprecated" (docs, 2026-07-18) and no operation in the 8-operation
    OpenAPI carries deprecated: true, so no Sunset header has been observed — the commitment is policy-level.
    The changelog the policy refers to has no public URL (see changelog/agent-ready-dev-changelog.yml).
