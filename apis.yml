aid: agent-ready-dev
name: Agent Ready
description: >-
  Agent Ready (agent-ready.dev) is an independent AI agent-readability scanner built and maintained by
  Mark Lavercombe. It scores any public website against the Vercel Agent Readability Spec, the llmstxt.org
  specification and the agent-protocol manifests (MCP server cards, A2A agent cards, agents.json,
  agent-permissions.json, UCP, ACP, x402, MPP, AP2, NLWeb, RFC 9727 API catalog, Web Bot Auth, Agent Skills
  Discovery) — 72 checks plus a separate 23-check WCAG 2.2 accessibility sub-score — and returns a 0-100
  score with per-check remediation. The same scanner is exposed as an OpenAPI 3.1 REST API at
  https://agent-ready.dev/api/v1 (Pro API keys, Idempotency-Key on writes, RFC 8594 Sunset policy), a hosted
  Streamable HTTP MCP server at /api/v1/mcp plus a no-auth MCP Apps endpoint, an A2A 1.0 agent card, a
  stdio MCP package and CLI on npm, JavaScript and Python client SDKs, a GitHub Action, and pay-per-scan
  x402/MPP micropayments in USDC on Base. Free ($0) and Pro ($19/month) plans.
