    name: Agent Ready MCP endpoint (Streamable HTTP, Bearer)
    url: https://agent-ready.dev/api/v1/mcp
  - type: MCPServer
    name: Agent Ready MCP Apps endpoint (no auth)
    url: https://agent-ready.dev/api/apps/mcp
