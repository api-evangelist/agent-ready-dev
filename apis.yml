- aid: agent-ready-dev:agent-ready-a2a-agent
  name: Agent Ready A2A Agent
  description: >-
    Agent2Agent (A2A) surface: a signed agent card served from https://agent-ready.dev/.well-known/agent-card.json
    (protocolVersion 1.0, JSONRPC, version 1.0.0, ES256 JWS signature with keys at /.well-known/jwks.json)
    declaring three skills — scan_site, get_scan and the public ask — at the JSON-RPC endpoint
    https://agent-ready.dev/api/v1/a2a. Bearer ar_live_ Pro key for scan_site and tasks/get; ask is public.
    Streaming and push notifications are declared unsupported.
  humanURL: https://agent-ready.dev/docs/api
  image: https://agent-ready.dev/icon-512.png
  baseURL: https://agent-ready.dev/api/v1/a2a
