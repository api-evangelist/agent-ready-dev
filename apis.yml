- aid: agent-ready-dev:agent-ready-mcp-server
  name: Agent Ready MCP Server
  description: >-
    Hosted Model Context Protocol server at https://agent-ready.dev/api/v1/mcp (Streamable HTTP, POST only,
    protocol version 2025-06-18, serverInfo agent-ready 1.0.0). initialize, tools/list, resources/list and
    prompts/list answer anonymously — three tools (scan_site, get_scan, ask) with full inputSchema,
    outputSchema and readOnlyHint/idempotentHint annotations — while tools/call for scan_site and get_scan
    needs a Bearer ar_live_ Pro key advertised through RFC 9728 protected-resource metadata. A second no-auth
    MCP Apps endpoint at /api/apps/mcp (also on mcp.agent-ready.dev) renders a ui:// score-card widget and is
    the Agent Ready app in the ChatGPT directory. A stdio wrapper ships on npm as agent-ready-mcp.
  humanURL: https://agent-ready.dev/mcp
  image: https://agent-ready.dev/icon-512.png
  baseURL: https://agent-ready.dev/api/v1/mcp
  tags:
  - MCP
  - agent-native
