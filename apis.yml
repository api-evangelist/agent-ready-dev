apis:
- aid: agent-ready-dev:agent-ready-api
  name: Agent Ready API
  description: >-
    REST API for agent-ready.dev scans, published as OpenAPI 3.1.0 at https://agent-ready.dev/api/v1/openapi.json
    (servers[] https://agent-ready.dev, info.contact support@agent-ready.dev). Eight operations: start a scan
    (POST /api/v1/scans, 202 + Location poll URL, optional Idempotency-Key with 24-hour retention), get a scan,
    list scans (cursor pagination), the public NLWeb /api/v1/ask endpoint (GET and POST, optional SSE
    streaming), the public POST /api/v1/scan/mcp that grades a live remote MCP server, and the x402/MPP
    pay-per-scan endpoint at /api/x402/scan (HTTP 402 challenge, USDC on Base). Bearer ar_live_ API keys
    (Pro plan) on the scans surface; ask, scan/mcp and x402 are key-free.
  humanURL: https://agent-ready.dev/docs/api
  image: https://agent-ready.dev/icon-512.png
  baseURL: https://agent-ready.dev
