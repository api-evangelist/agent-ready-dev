retry_guidance: >-
  On 429 honour Retry-After — wait at least that long. On transient 5xx use exponential backoff with full
  jitter: delay = random(0, 250 ms × 2^attempt), capped at 30 s, over ~5 attempts. Never retry a 4xx other
  than 429. (Verbatim strategy from the docs, which also ship a TypeScript callWithRetry sample.)
