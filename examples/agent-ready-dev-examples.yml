- operationId: startScan
  title: Start a scan (Pro key) and receive a poll URL
  source: https://agent-ready.dev/docs/api#quickstart
  request:
    method: POST
    url: https://agent-ready.dev/api/v1/scans
    headers: {Authorization: 'Bearer $AGENT_READY_API_KEY', Content-Type: application/json, Idempotency-Key: '<client-generated 1-255 chars, optional>'}
    body: {url: https://example.com}
  response:
    status: 202
    headers: {Location: /api/v1/scans/V1StGXR8_Z}
    body: {id: V1StGXR8_Z, pollUrl: /api/v1/scans/V1StGXR8_Z, status: queued}
  note: The scan id V1StGXR8_Z is the docs' illustrative sample.
- operationId: getScan
  title: Poll a scan until completed
  source: https://agent-ready.dev/docs/api#quickstart
  request:
    method: GET
    url: https://agent-ready.dev/api/v1/scans/V1StGXR8_Z
    headers: {Authorization: 'Bearer $AGENT_READY_API_KEY'}
  response:
    status: 200
