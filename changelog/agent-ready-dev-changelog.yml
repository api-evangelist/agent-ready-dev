summary: >-
  Agent Ready's deprecation policy promises to announce removals "in the changelog", but no changelog page is
  published on agent-ready.dev: /changelog, /changelog.md, /docs/changelog and /api/v1/changelog all return 404
  and the sitemap lists none. The only dated, public change record is the GitHub Releases feed of the
  first-party packages — agent-ready-mcp (the busiest, 0.6.1 -> 0.7.7 across 2026-07-19..2026-09-07) and
  agent-ready-cli (a single v0.1.1 release on 2026-05-31; npm is at 0.6.1). Those releases track the client
  wrappers, and their notes double as a record of the hosted scanner's check-registry growth (59 -> 70 -> 71
  -> 72 checks). The markdown mirrors also carry last_updated frontmatter, recorded below as the only per-page
  change signal on the site itself.
