  authentication: authentication/agent-ready-dev-authentication.yml
  scopes: scopes/agent-ready-dev-scopes.yml
  errors: errors/agent-ready-dev-problem-types.yml
  lifecycle: lifecycle/agent-ready-dev-lifecycle.yml
  rate_limits: rate-limits/agent-ready-dev-rate-limits.yml
