generated: '2026-09-19'
method: probed
source: live probes of /.well-known/ and root discovery paths on every Agent Ready host
summary: >-
  Agent Ready is a provider that implements the discovery conventions it audits, and the probe shows it: on
  the apex host agent-ready.dev, 17 of the named paths return real documents — RFC 8414 authorization-server
  metadata, RFC 9728 protected-resource metadata, an RFC 9727 api-catalog linkset (served with the correct
  application/linkset+json profile), ai-plugin.json, an A2A agent card (application/a2a+json), the MCP server
  card at both /.well-known/mcp.json and /.well-known/mcp/server-card.json, Wildcard agents.json,
  agent-permissions.json, a UCP profile at /.well-known/ucp, an AI Catalog, x402 and MPP payable-resource
  documents, a Web Bot Auth http-message-signatures-directory, a JWKS, an Agent Skills Discovery index and a
  live self-scan status document. The MCP host mcp.agent-ready.dev is the same Vercel deployment and serves the
  same set (its own server card names the no-auth Apps server). Genuine misses: no security.txt on any host
  (so NO SecurityTxt pointer), no OpenID Connect discovery, no ucp.json / acp.json / aauth-resource.json, and
  no APIs.json at any of the three probed locations. www.agent-ready.dev, api.agent-ready.dev and
  docs.agent-ready.dev resolve but present an EXPIRED TLS certificate (curl error 60), so nothing on them could
  be read; the provider's canonical host is the apex.
pointer_basis: >-
  WellKnown pointer emitted on the strength of the served documents on agent-ready.dev and mcp.agent-ready.dev.
  APICatalog pointer emitted for the RFC 9727 linkset. HTTPMessageSignatures and ContentSignal pointers emitted
  for the Web Bot Auth directory and the Content-Signal directives in robots.txt (the consent_identity family).
  SecurityTxt pointer NOT emitted — RFC 9116 is unimplemented on every host (404 at /.well-known/security.txt
  and /security.txt).
false_positive_watch: >-
  The apex host answers unpublished /.well-known/* paths with a real HTTP 404 (the site's HTML not-found page,
  ~257 KB), never a 200 shell, so every 200 recorded below is a served document. Two SPA-shell traps do exist
  on this host and are NOT counted as documents: GET /mcp (200 text/html) is the human MCP install guide, not
  an MCP endpoint (POST there answers 405), and GET /docs is the developer hub HTML. Every JSON document below
  was parsed before being recorded.
