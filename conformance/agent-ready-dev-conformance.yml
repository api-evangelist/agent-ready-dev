summary: >-
  Agent Ready's conformance profile is the agent-discovery and agent-commerce protocol stack — it is a scanner
  for those conventions and implements each one it grades on its own host: A2A 1.0 (signed card), MCP
  2025-06-18 with SEP-2127 server cards, RFC 9728 / RFC 8414 discovery, RFC 9727 api-catalog, Wildcard
  agents.json, LAS-WG agent-permissions.json, UCP 2026-04-08, x402 v2 and MPP payment challenges, NLWeb /ask,
  Web Bot Auth (RFC 9421 directory), Agent Skills Discovery, llms.txt, Content-Signal, and an Idempotency-Key
  contract with RFC 8594/9745 sunset headers. It publishes NO enterprise certification (no SOC 2 / ISO 27001
  claim anywhere on the site, no trust center), NO RFC 9116 security.txt, NO OpenID Connect, and its errors
  are a proprietary envelope rather than RFC 9457. No Compliance pointer is emitted.
