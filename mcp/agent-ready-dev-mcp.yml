- id: agent-ready-mcp-stdio
  name: agent-ready-mcp (npm)
  transport: stdio
  install: npx -y agent-ready-mcp@latest
  package: https://www.npmjs.com/package/agent-ready-mcp
  repo: https://github.com/mlava/agent-ready-mcp
  version: 0.7.7
  published: '2026-09-07'
  license: MIT
  auth: 'optional AGENT_READY_API_KEY env; keyless runs on the anonymous free tier (3 scans / 30 days per IP, 25-page depth)'
  status: published
  note: >-
    A thin stdio wrapper over the REST API (POST /api/v1/scans etc.), used by the provider's Cursor plugin
    (mcp.json) and Gemini CLI extension (gemini-extension.json), both of which spawn npx -y agent-ready-mcp@latest.
