    resources_list:
      http_status: 200
      resources: [ui://widget/agent-ready-score.html, agent-ready://methodology, agent-ready://checks, agent-ready://llms.txt, agent-ready://specs]
  authorship: provider
  tools:
  - {name: scan_site, auth: none, input_schema: {url: 'string, format uri, maxLength 2000 (required)'}, note: 'No pageLimit on the Apps endpoint; renders the ui:// score card. Rate-limited per opaque openai/subject user id (privacy policy §9).'}
