  /api/v1/scan/mcp:
    post:
      operationId: scanMcp
      summary: Scan a live MCP server
      description: "Connects to a remote MCP endpoint over Streamable HTTP, runs the
        handshake, and grades the tools, resources, and prompts it advertises
        against MCP best practices. Returns a weighted mcpScore (0–100) with
        per-check findings. Synchronous (no polling). Public — no API key
        required. Remote http(s) endpoints only; stdio servers aren't reachable.
        This is a standalone tool: its score is independent of the site
        agent-readability score."
      tags:
        - MCP
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/McpScanRequest"
      responses:
        "201":
          description: The MCP server scan result and its shareable report URL.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/McpScanResponse"
        "400":
          description: Invalid or blocked endpoint (bad URL, non-http(s), or a
            private/reserved address).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Rate limit exceeded. Response carries `Retry-After` (seconds). Back
            off with exponential delay + jitter.
          headers: *a1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: The MCP server could not be scanned. Retry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/x402/scan:
    get:
      operationId: x402ScanChallenge
      summary: x402 payment challenge for a paid scan
      description: "Returns an HTTP 402 payment-requirements challenge for the paid
        scan resource (x402 v2). This is the discovery/probe surface: it always
        402s with the v2 PaymentRequired delivered in the base64
        `PAYMENT-REQUIRED` response header (and mirrored in the JSON body) —
        x402Version 2 + resource + accepts[] + Bazaar discovery extensions. To
        run a scan, POST to this path with a signed PAYMENT-SIGNATURE (x402 v2)
        or X-PAYMENT (v1) header."
      tags:
        - Scans
      security: []
      responses:
        "402":
          description: "Payment required. The `PAYMENT-REQUIRED` header (and JSON body)
            carry an x402 v2 PaymentRequired object: { x402Version: 2, resource,
            accepts: [...] }. Each `accepts` entry uses `amount` (atomic units)
            and a CAIP-2 `network` (eip155:8453 = Base mainnet). Two tiers —
            $0.02 USDC (25 pages), $0.25 (250 pages)."
          headers: &a2
            PAYMENT-REQUIRED:
              description: Base64-encoded x402 v2 PaymentRequired object (HTTP transport
                spec). Carries the same { x402Version, resource, accepts[],
                extensions } as the JSON body.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      x-payment-info: &a3
        price:
          mode: dynamic
          currency: USD
          min: "0.02"
          max: "0.25"
        protocols:
          - x402: {}
          - mpp:
              method: evm
              intent: charge
              currency: "0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913"
        method: evm
        intent: charge
        amount: "20000"
        currency: "0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913"
    post:
      operationId: x402Scan
      summary: Run a scan, paid via x402
      description: "Runs an agent-readability scan paid via x402 v2 (no account or
        subscription). Without a valid `X-PAYMENT` header this returns a v2 402
        challenge; sign the EIP-3009 USDC authorization for one of the
        advertised tiers and resend the v2 payment payload in the `X-PAYMENT`
        header to run the scan. Settlement is on Base mainnet (CAIP-2
        eip155:8453; the facilitator pays gas); the response carries an
        `X-PAYMENT-RESPONSE` header. Tiers: $0.02 (25 pages), $0.25 (250
        pages)."
      tags:
        - Scans
      security: []
      parameters:
        - schema:
            type: string
            description: Base64-encoded signed x402 payment authorization. Omit it to
              receive the 402 challenge.
          required: false
          description: Base64-encoded signed x402 payment authorization. Omit it to
            receive the 402 challenge.
          name: X-PAYMENT
          in: header
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                url:
                  type: string
                  format: uri
              required:
                - url
              description: The website URL to scan.
      responses:
        "201":
          description: Payment verified and the scan completed. The `X-PAYMENT-RESPONSE`
            header carries the settlement.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaidScanResponse"
        "400":
          description: Invalid JSON body, URL, or a blocked address.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "402":
          description: Payment required or verification failed. The `PAYMENT-REQUIRED`
            header (and JSON body) carry the x402 v2 challenge ({ x402Version,
            resource, accepts, error }).
          headers: *a2
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: The scan failed after payment. Retry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
      x-payment-info: *a3
webhooks: {}
